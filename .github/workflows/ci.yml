name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The tests replace the speech models and Claude with stand-ins: no GPU, downloads or API key needed.
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
