[project]
name = "polysub"
version = "2.0.0"
description = "Subtitles from any language to any language: local speech recognition (Qwen3-ASR, Whisper large-v3) + Claude translation"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
polysub = "polysub.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
